    <section id="about-me">
      <nav>
        <div class="personal__logo">Derek Govert</div>

      <div class="flex flex-1">

            <h1 class="about-me__info--title">

              I'm a
              <strong class="text--purple"> Frontend Software engineer </strong>
              seeking new opportunity that can take me around the world. I
              couldn't be more excited to see where this goes!
            </p>
            <div class="about-me__links">
              <a href="" class="about-me__link">
                <i class="fa-brands fa-linkedin-in"></i>
              </a>
              <a href="" class="about-me__link">
                <i class="fa-brands fa-square-github"></i>
              </a>
              <a href="" class="about-me__link">
                <i class="fa-solid fa-envelope"></i>
              </a>
              <a href="" class="about-me__link">
                <i class="fa-solid fa-file-pdf"></i>
              </a>
            </div>
          </div>
          <figure class="about-me__img--container">
            <img
              src="./assets/undraw_websites.svg"
              class="about-me__img"
              alt=""
            />
          </figure>
        </div>
